name: Task36 regression verification

on:
  push:
    branches: [task36/cyber-regression-20261023]
  workflow_dispatch:
    inputs:
      source:
        description: Full 40-character product source commit to validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.sha }}
      run_backend: true
      run_frontend: true
  candidate-image:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[task36-image]'))
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TASK36_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.sha }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TASK36_SOURCE }}
      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK36_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TASK36_SOURCE"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Define immutable candidate identity
        shell: bash
        run: |
          {
            echo "CPR_IMAGE=codex-proxy-rs:task36-${TASK36_SOURCE}"
            echo "TASK36_IMAGE=ghcr.io/x-t-e-r/codex-proxy-rs:task36-sha-${TASK36_SOURCE}"
            echo "TASK36_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build full runtime including frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ env.TASK36_SOURCE }}
            org.opencontainers.image.source=https://github.com/X-T-E-R/codex-proxy-rs
          build-args: |
            CPR_GIT_SHA=${{ env.TASK36_SOURCE }}
            CPR_BUILD_TIME=${{ env.TASK36_BUILD_TIME }}
            CPR_BUILD_TYPE=release
          cache-from: type=gha,scope=task35-runtime
          cache-to: type=gha,mode=max,scope=task35-runtime
          no-cache-filters: |
            runtime-base
            runtime
      - name: Verify actual candidate and authenticated Admin APIs
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: task36-container-${{ env.TASK36_SOURCE }}
          verify-site-recovery: 'true'
      - name: Login to self-fork registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable candidate
        shell: bash
        run: |
          docker tag "$CPR_IMAGE" "$TASK36_IMAGE"
          docker push "$TASK36_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$TASK36_IMAGE" > "$RUNNER_TEMP/task36-image.txt"
          {
            echo "Source: $TASK36_SOURCE"
            echo "Image: $(<"$RUNNER_TEMP/task36-image.txt")"
            echo "Tag: $TASK36_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task36-image-${{ env.TASK36_SOURCE }}
          path: ${{ runner.temp }}/task36-image.txt
          if-no-files-found: error
