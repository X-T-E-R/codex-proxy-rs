name: Task35 candidate verification

on:
  push:
    branches: [task35/upgrade-20261023]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
      # 最终镜像沿用 9503cee9 已完成的同字节后端全套证据，只新增前端与实际镜像验收
      run_backend: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[task35-image]')) }}
      run_frontend: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[task35-image]') }}
  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:18-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
        env:
          POSTGRES_DB: codex_proxy
          POSTGRES_USER: codex_proxy
          POSTGRES_PASSWORD: codex_proxy
        options: >-
          --health-cmd "pg_isready -U codex_proxy -d codex_proxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse proven production-scale synthetic recovery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task35-recovery-9503cee9ad9d1eb2727a339f0fad0e309423ade8
          run-id: 39939368951
          repository: X-T-E-R/codex-proxy-rs
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task35-recovery
      - name: Download pinned old production binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quota-linux-binary
          run-id: 37242026140
          repository: X-T-E-R/codex-proxy-rs
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task35-old45
      - name: Start old writer on recovered DB without external egress
        shell: bash
        env:
          CPR_DRILL_POSTGRES: ${{ job.services.postgres.id }}
          CPR_DRILL_REDIS: ${{ job.services.redis.id }}
        run: >-
          python .github/scripts/task35-old-binary-smoke.py
          --artifacts "$RUNNER_TEMP/task35-recovery"
          --binary-directory "$RUNNER_TEMP/task35-old45"
          --postgres "$CPR_DRILL_POSTGRES" --redis "$CPR_DRILL_REDIS" --restore-dump
      - name: Preserve synthetic recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task35-recovery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task35-recovery/task35-recovery.json
            ${{ runner.temp }}/task35-recovery/synthetic-recovery.dump
            ${{ runner.temp }}/task35-recovery/old45-startup.log
          if-no-files-found: error
  candidate-image:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[task35-image]')
    needs: [quality, recovery-drill]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout accepted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Match admitted backend evidence
        shell: bash
        run: |
          git fetch --depth=1 origin 9503cee9ad9d1eb2727a339f0fad0e309423ade8
          git diff --exit-code 9503cee9ad9d1eb2727a339f0fad0e309423ade8 -- backend
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Define immutable candidate identity
        shell: bash
        run: |
          echo "CPR_IMAGE=codex-proxy-rs:task35-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "TASK35_IMAGE=ghcr.io/x-t-e-r/codex-proxy-rs:task35-sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "TASK35_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build exact full runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/X-T-E-R/codex-proxy-rs
          build-args: |
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ env.TASK35_BUILD_TIME }}
            CPR_BUILD_TYPE=release
          cache-from: type=gha,scope=task35-runtime
          cache-to: type=gha,mode=max,scope=task35-runtime
          no-cache-filters: |
            runtime-base
            runtime
      - name: Verify actual candidate image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: task35-container-${{ github.sha }}
      - name: Login to self-fork registry
        uses: docker/login-action@a84a5da2a638a20459c5da46892714ce6ebc67e3 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified immutable image
        shell: bash
        run: |
          docker tag "$CPR_IMAGE" "$TASK35_IMAGE"
          docker push "$TASK35_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$TASK35_IMAGE" > "$RUNNER_TEMP/task35-image.txt"
          {
            echo "Source: $GITHUB_SHA"
            echo "Image: $(<"$RUNNER_TEMP/task35-image.txt")"
            echo "Tag: $TASK35_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task35-image-${{ github.sha }}
          path: ${{ runner.temp }}/task35-image.txt
          if-no-files-found: error
