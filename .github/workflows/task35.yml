name: Task35 candidate verification

on:
  push:
    branches: [task35/upgrade-20261023]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
      # 镜像沿用9503后端与088前端同字节质量证据，实际镜像仍从源码完整build
      run_backend: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[task35-image]')) }}
      run_frontend: false
  recovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reuse admitted scale recovery and old-writer receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task35-recovery-a690a7d278c5672381eff3f9f2e7e8517b7e5bcb
          run-id: 39941912725
          repository: X-T-E-R/codex-proxy-rs
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task35-recovery
  candidate-image:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[task35-image]')
    needs: [quality, recovery-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout accepted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Match admitted code and recovery evidence
        shell: bash
        run: |
          git fetch --depth=1 origin a690a7d278c5672381eff3f9f2e7e8517b7e5bcb
          git diff --exit-code a690a7d278c5672381eff3f9f2e7e8517b7e5bcb -- backend frontend .github/scripts
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Define immutable candidate identity
        shell: bash
        run: |
          {
            echo "CPR_IMAGE=codex-proxy-rs:task35-${GITHUB_SHA}"
            echo "TASK35_IMAGE=ghcr.io/x-t-e-r/codex-proxy-rs:task35-sha-${GITHUB_SHA}"
            echo "TASK35_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build exact full runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/X-T-E-R/codex-proxy-rs
          build-args: |
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ env.TASK35_BUILD_TIME }}
            CPR_BUILD_TYPE=release
          cache-from: type=gha,scope=task35-runtime
          cache-to: type=gha,mode=max,scope=task35-runtime
          no-cache-filters: |
            runtime-base
            runtime
      - name: Verify actual candidate image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: task35-container-${{ github.sha }}
      - name: Login to self-fork registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified immutable image
        shell: bash
        run: |
          docker tag "$CPR_IMAGE" "$TASK35_IMAGE"
          docker push "$TASK35_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$TASK35_IMAGE" > "$RUNNER_TEMP/task35-image.txt"
          {
            echo "Source: $GITHUB_SHA"
            echo "Image: $(<"$RUNNER_TEMP/task35-image.txt")"
            echo "Tag: $TASK35_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task35-image-${{ github.sha }}
          path: ${{ runner.temp }}/task35-image.txt
          if-no-files-found: error
