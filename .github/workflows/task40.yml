name: Task40 production candidate verification

on:
  push:
    branches: [task40/prod-upstream-v334-20261027]
    paths-ignore:
      - 'deploy/task40-prod-upgrade/**'
      - '.github/scripts/task40-*.py'
      - '.github/workflows/task40.yml'
  workflow_dispatch:
    inputs:
      verify_image:
        description: 'Existing immutable runtime image for schema53 deployment verification only'
        type: string
        default: ''
      verify_source:
        description: 'Exact runtime source SHA carried by verify_image'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/task40/prod-upstream-v334-20261027' && inputs.verify_image == ''
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
      run_backend: true
      run_frontend: true

  candidate-image:
    if: github.ref == 'refs/heads/task40/prod-upstream-v334-20261027' && inputs.verify_image == ''
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Define candidate image identity
        shell: bash
        run: |
          {
            echo "CPR_IMAGE=codex-proxy-rs:task40-${GITHUB_SHA}"
            echo "TASK40_IMAGE=ghcr.io/x-t-e-r/codex-proxy-rs:task40-sha-${GITHUB_SHA}"
            echo "TASK40_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build complete runtime including frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/X-T-E-R/codex-proxy-rs
          build-args: |
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ env.TASK40_BUILD_TIME }}
            CPR_BUILD_TYPE=release
          cache-from: |
            type=gha,scope=task40-runtime
            type=gha,scope=task35-runtime
          cache-to: type=gha,mode=max,scope=task40-runtime
          no-cache-filters: |
            runtime-base
            runtime

      - name: Verify runtime, authenticated Admin and recovery
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: task40-container-${{ github.sha }}
          verify-site-recovery: 'true'

      - name: Login to self-fork registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified SHA and latest image
        shell: bash
        run: |
          set -euo pipefail
          latest_image=ghcr.io/x-t-e-r/codex-proxy-rs:latest
          docker tag "$CPR_IMAGE" "$TASK40_IMAGE"
          docker push "$TASK40_IMAGE"
          docker tag "$CPR_IMAGE" "$latest_image"
          docker push "$latest_image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$TASK40_IMAGE" > "$RUNNER_TEMP/task40-image.txt"
          {
            echo "Source: $GITHUB_SHA"
            echo "Image: $(<"$RUNNER_TEMP/task40-image.txt")"
            echo "Tag: $TASK40_IMAGE"
            echo "Latest: $latest_image"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve verified image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task40-image-${{ github.sha }}
          path: ${{ runner.temp }}/task40-image.txt
          if-no-files-found: error

  deployment-carrier:
    if: github.ref == 'refs/heads/task40/prod-upstream-v334-20261027' && github.event_name == 'workflow_dispatch' && inputs.verify_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout deployment carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify deployment journal and recovery simulations
        run: python3 -B -m unittest discover -s deploy/task40-prod-upgrade -p 'test_*.py' -v

      - name: Verify exact runtime schema53 upgrade and checked recovery
        env:
          VERIFY_IMAGE: ${{ inputs.verify_image }}
          VERIFY_SOURCE: ${{ inputs.verify_source }}
        run: >-
          python3 -B .github/scripts/task40-schema53-smoke.py
          --image "$VERIFY_IMAGE" --source "$VERIFY_SOURCE"
          --output "$RUNNER_TEMP/task40-schema53.json"

      - name: Preserve schema and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task40-schema53-${{ github.sha }}
          path: ${{ runner.temp }}/task40-schema53.json
          if-no-files-found: error
