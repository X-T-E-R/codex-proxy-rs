name: Fork Image

# 仅用于线上 2653 基线的线程隔离热修复；不覆盖 latest，不重建前端与运行时基础。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cyber-thread-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare baseline-only backend patch build
        shell: bash
        run: |
          sha256sum backend/crates/gateway-core/src/policy/cyber_session.rs backend/crates/gateway-api/src/openai/responses/request.rs
          cat > /tmp/cpr-hotfix.Dockerfile <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
          FROM rust:1.98-bookworm@sha256:9a73a5088750b4c95158ab26629c854c3d6fc4b173cb7bc8079ad252d8ed7bfa AS backend-builder
          WORKDIR /app/backend
          ARG CPR_GIT_SHA
          ENV CPR_GIT_SHA=${CPR_GIT_SHA} CPR_BUILD_TYPE=release RUST_MIN_STACK=16777216 CARGO_TARGET_DIR=/app/backend/target/amd64
          COPY backend/Cargo.toml backend/Cargo.lock ./
          COPY backend/apps ./apps
          COPY backend/crates ./crates
          COPY backend/migrations ./migrations
          COPY release/version.yaml /app/release/version.yaml
          RUN --mount=type=cache,target=/usr/local/cargo/registry --mount=type=cache,target=/usr/local/cargo/git --mount=type=cache,target=/app/backend/target \
              rustc --version && rustup component add rustfmt && cargo fmt --all -- --check \
              && cargo test --locked -p gateway-core --test main policy::cyber_session \
              && cargo test --locked -p gateway-core --test main engine::execution \
              && cargo test --locked -p gateway-api --test main openai::responses::request \
              && cargo test --locked -p gateway-store --test main --no-run \
              && cargo build --release --locked --bin codex-proxy-rs \
              && cp "${CARGO_TARGET_DIR}/release/codex-proxy-rs" /tmp/codex-proxy-rs \
              && sha256sum /tmp/codex-proxy-rs
          FROM ghcr.io/x-t-e-r/codex-proxy-rs@sha256:a6016c1846f9b45b4b2fe390114165cbae0975dc2302049b9ac12edb5b539c01 AS runtime
          ARG CPR_GIT_SHA
          LABEL org.opencontainers.image.revision=${CPR_GIT_SHA} cpr.hotfix.baseline=2653ae2779b962320376ae89312f37ad9403614f cpr.hotfix.scope=cyber-thread-isolation
          COPY --from=backend-builder --chown=10001:10001 /tmp/codex-proxy-rs /app/bin/codex-proxy-rs
          DOCKERFILE

      - name: Test, build and push immutable hotfix image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: /tmp/cpr-hotfix.Dockerfile
          target: runtime
          push: true
          cache-from: type=gha,scope=fork-runtime
          cache-to: type=gha,mode=max,scope=cyber-thread-2653
          build-args: |
            CPR_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Record exact image identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          echo "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA; baseline: 2653ae2779b962320376ae89312f37ad9403614f" >> "$GITHUB_STEP_SUMMARY"
