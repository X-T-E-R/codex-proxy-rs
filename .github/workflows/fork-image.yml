name: Quota Candidate Delta Verification

# 独立验证分支。复用已绑定源码的绿灯，不覆盖 main/latest。
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: quota-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: 16777216
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:18-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
        env:
          POSTGRES_DB: codex_proxy
          POSTGRES_USER: codex_proxy
          POSTGRES_PASSWORD: codex_proxy
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U codex_proxy -d codex_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download immutable previous validation manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quota-validation-input
          path: previous-validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37239982515
      - name: Bind reusable evidence to unchanged production inputs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git ls-files -z | xargs -0 sha256sum > source-manifest.sha256
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          prior=pathlib.Path('previous-validation/source-manifest.sha256').read_bytes()
          assert hashlib.sha256(prior).hexdigest()=='bb9edb67980a17e55d3425dc26043e34fb43c30973681d903fe4947dbcb17389'
          def records(raw):
              return dict((path, digest) for digest,path in (line.split('  ',1) for line in raw.decode().splitlines()))
          old=records(prior)
          current=records(pathlib.Path('source-manifest.sha256').read_bytes())
          allowed={'.github/workflows/fork-image.yml', 'backend/crates/gateway-store/tests/postgres/mod.rs', 'backend/crates/gateway-store/tests/postgres/proxies.rs', 'backend/crates/gateway-store/tests/postgres/runtime_settings.rs'}
          assert old.keys()==current.keys(),'new/deleted tracked input invalidates reuse'
          changed={path for path in old if old[path]!=current[path]}
          assert changed==allowed,changed
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='259a2f8bc61d2e6b8d1a55a791991f5bb78634b2'
          base='99e0447d74dcc4ba4fdbe2b92a6ee708bcc8dea2'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base,'backend/migrations'],text=True).splitlines()
          for path in paths:
              if path.endswith('.sql'):
                  assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',f'{base}:{path}']),path
          assert hashlib.sha256(pathlib.Path('backend/migrations/0032_quota_policy.sql').read_bytes()).hexdigest()=='497f22c4af0586aca9f8dc4eb5d6a6d667ae8fcfa0063cbba102458c89d87fb4'
          PY
          (cd backend/migrations && sha256sum --check --strict .frozen-sha256)
          printf 'Reuse run37239982515/source259a2f8: PG7, Provider789 including4 transport cases, App42/Admin192/API421/Core394/Host97/Protocol64 and frontend lint/build. Only3 Store test files plus workflow differ; no production source or frontend changes. This run verifies the delta, not repeats those results.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Setup standard Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: backend -> target
          shared-key: quota-candidate-linux-1.97.1
      - name: Configure isolated authenticated test services
        shell: bash
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          redis_password="$(openssl rand -hex 24)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$redis_password"
          docker exec --env PGPASSWORD=codex_proxy "${{ job.services.postgres.id }}" psql --username=codex_proxy --dbname=codex_proxy --set=ON_ERROR_STOP=1 --command="ALTER USER codex_proxy WITH PASSWORD '${postgres_password}'" >/dev/null
          docker exec --env PGPASSWORD="$postgres_password" "${{ job.services.postgres.id }}" psql --username=codex_proxy --dbname=codex_proxy --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$redis_password" >/dev/null
          docker exec --env REDISCLI_AUTH="$redis_password" "${{ job.services.redis.id }}" redis-cli ping >/dev/null
          {
            echo "CPR_TEST_DATABASE_URL=postgres://codex_proxy:${postgres_password}@127.0.0.1:5432/codex_proxy"
            echo "CPR_TEST_REDIS_URL=redis://:${redis_password}@127.0.0.1:6379"
          } >> "$GITHUB_ENV"
      - name: Format and complete affected Store tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          unset CPR_DATABASE_URL CPR_REDIS_URL CPR_DATABASE_PASSWORD CPR_REDIS_PASSWORD
          test -n "$CPR_TEST_DATABASE_URL" && test -n "$CPR_TEST_REDIS_URL"
          cargo fmt --all -- --check
          cargo test --locked -p gateway-store --test main 2>&1 | tee ../store-tests.log
          grep -Eq 'test result: ok\. 278 passed; 0 failed; 0 ignored' ../store-tests.log
      - name: Strict affected-crate Clippy
        working-directory: backend
        run: cargo clippy --locked -p gateway-core -p gateway-admin -p gateway-api -p gateway-store -p provider-openai --all-targets --all-features -- -D warnings
      - name: Build production binary with pinned Bookworm toolchain
        working-directory: backend
        shell: bash
        env:
          CPR_GIT_SHA: ${{ github.sha }}
          CPR_BUILD_TYPE: release
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo" ../quota-binary
          docker run --rm --init --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo -e HOME=/tmp \
            -e CARGO_TARGET_DIR=/workspace/backend/target-bookworm \
            -e CARGO_BUILD_JOBS=2 -e RUST_MIN_STACK=16777216 \
            -e CPR_GIT_SHA -e CPR_BUILD_TYPE \
            -v "$HOME/.cargo:/cargo" -v "$PWD/..:/workspace" \
            -w /workspace/backend \
            rust:1.97-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa \
            sh -eu -c 'rustc --version; cargo --version; cargo build --release --locked --target x86_64-unknown-linux-gnu --bin codex-proxy-rs'
          cp target-bookworm/x86_64-unknown-linux-gnu/release/codex-proxy-rs ../quota-binary/
          sha256sum ../quota-binary/codex-proxy-rs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quota-linux-binary
          path: quota-binary/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quota-validation-input
          path: |
            source-manifest.sha256
            store-tests.log

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reuse verified frontend artifact without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quota-frontend-dist
          path: frontend-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37239982515
      - name: Verify exact frontend bytes and record reuse
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('frontend-dist')
          rows=sorted([{'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in root.rglob('*') if p.is_file()],key=lambda row:row['path'])
          assert len(rows)==109
          assert hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()=='1b19d6776dd7a0942d4520ced0e9176cdf060b1ec7b8586dd8a0718a002e4d8a'
          PY
          printf 'Frontend109files reused from successful lint/build in run37239982515; POSIX-lexical manifest SHA1b19d6776dd7a0942d4520ced0e9176cdf060b1ec7b8586dd8a0718a002e4d8a. Backend guard verifies no frontend source change.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quota-frontend-dist
          path: frontend-dist/
          if-no-files-found: error

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quota-linux-binary
          path: quota-image/bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quota-frontend-dist
          path: quota-image/web/dist
      - name: Prepare exact-baseline runtime image
        shell: bash
        run: |
          printf 'IMAGE_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          git ls-files -z | xargs -0 sha256sum > quota-image/source-manifest.sha256
          chmod 0755 quota-image/bin/codex-proxy-rs
          cat > quota-image/Dockerfile <<'DOCKERFILE'
          FROM ghcr.io/x-t-e-r/codex-proxy-rs@sha256:16d8a694328e2322f3538acb6fc237e38bf23569b31dbc9ca89f6171cf42e6e5
          ARG CPR_GIT_SHA
          LABEL org.opencontainers.image.revision=${CPR_GIT_SHA} cpr.candidate.baseline=99e0447d74dcc4ba4fdbe2b92a6ee708bcc8dea2 cpr.candidate.scope=credits-quota-window-policy
          USER root
          RUN rm -rf /app/web/dist && install -d -o 10001 -g 10001 /app/web/dist
          COPY --chown=10001:10001 bin/codex-proxy-rs /app/bin/codex-proxy-rs
          COPY --chown=10001:10001 web/dist /app/web/dist
          COPY --chown=10001:10001 source-manifest.sha256 /app/bin/quota-source-manifest.sha256
          USER 10001:10001
          DOCKERFILE
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load candidate without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: quota-image
          file: quota-image/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: CPR_GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ env.IMAGE_NAME }}:quota-sha-${{ github.sha }}
      - name: Gate new binary in exact production runtime
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_NAME}:quota-sha-${GITHUB_SHA}"
          expected="$(sha256sum quota-image/bin/codex-proxy-rs | cut -d ' ' -f 1)"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh \
            -e EXPECTED_BINARY_SHA="$expected" "$image" -eu -c '
              actual="$(sha256sum /app/bin/codex-proxy-rs | cut -d " " -f 1)"
              test "$actual" = "$EXPECTED_BINARY_SHA"
              deps="$(ldd /app/bin/codex-proxy-rs 2>&1)"
              printf "%s\n" "$deps"
              if printf "%s\n" "$deps" | grep -q "not found"; then exit 1; fi
              set +e
              output="$(/app/bin/codex-proxy-rs --help 2>&1)"
              status=$?
              set -e
              printf "%s\n" "$output"
              # CLI supports serve only. This proves ELF/CLI loading, not TLS or serving.
              test "$status" -eq 1
              printf "%s\n" "$output" | grep -F "unknown command" >/dev/null
              printf "%s\n" "$output" | grep -F "expected serve" >/dev/null
            '
          printf 'Runtime loading gate passed; binary SHA256%s; source%s\n' "$expected" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tested immutable candidate only
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_NAME}:quota-sha-${GITHUB_SHA}"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s; source%s\n' "ghcr.io/${IMAGE_NAME}" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
